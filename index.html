<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="找人">
  <title>找人</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css?v=20260915-4">
</head>
<body>
  <header class="topbar">
    <div><p class="eyebrow">本机私密名册</p><h1>找人</h1></div>
    <button id="dataButton" class="icon-button" type="button" aria-label="数据管理">•••</button>
  </header>

  <main>
    <section id="setup" class="setup hidden" aria-live="polite">
      <div class="setup-mark">私</div>
      <h2>导入学生头像总库</h2>
      <p>首次导入 <strong>students-data.js</strong>。姓名和照片保存在本机，不上传到网页服务器。</p>
      <label class="primary-button file-button">选择学生头像总库<input id="studentSetupFile" type="file" accept=".js,text/javascript,application/javascript"></label>
      <p class="fineprint">旧版 private-data.js 也可以直接导入，系统会自动拆分。</p>
    </section>

    <div id="app" class="hidden">
      <nav class="mode-switch" aria-label="功能模式">
        <button class="mode active" data-mode="find" type="button"><span>找人</span></button>
        <button class="mode" data-mode="duty" type="button"><span>值日</span></button>
        <button class="mode" data-mode="dorm" type="button"><span>宿舍</span></button>
        <button class="mode" data-mode="where" type="button"><span>去向</span></button>
        <button class="mode" data-mode="batch" type="button"><span>点人</span><b id="batchCount" class="count">0</b></button>
      </nav>

      <section id="searchPanel" class="search-panel">
        <label class="search-box">
          <span aria-hidden="true">⌕</span>
          <input id="searchInput" type="search" enterkeyhint="search" autocomplete="off" autocapitalize="none" placeholder="姓名 / 拼音 / 首字母，如 wjx">
          <button id="clearSearch" type="button" aria-label="清空搜索">×</button>
        </label>
        <p id="searchHint" class="search-hint">支持姓名、拼音和首字母</p>
      </section>

      <section id="findView" class="view">
        <div class="section-heading"><h2 id="resultTitle">全班同学</h2><span id="resultCount"></span></div>
        <div id="studentRail" class="student-rail"></div>
        <p class="swipe-tip">左右滑动查看 · 点头像可标记请假、去向或补照片</p>
      </section>

      <section id="dutyView" class="view hidden">
        <div class="duty-head">
          <div><p id="dateLabel" class="eyebrow"></p><h2 id="dutyTitle">今日值日</h2></div>
          <select id="daySelect" aria-label="选择星期"></select>
        </div>
        <p id="dutyWeekNotice" class="data-notice"></p>
        <div id="dutyList" class="duty-list"></div>
      </section>

      <section id="dormView" class="view hidden">
        <div class="section-heading"><div><p class="eyebrow">宿舍成员一览</p><h2 id="dormTitle">全部宿舍</h2></div><span id="dormCount"></span></div>
        <div id="dormList" class="dorm-list"></div>
      </section>

      <section id="whereView" class="view hidden">
        <div class="section-heading"><div><p id="whereDate" class="eyebrow"></p><h2>全班去向</h2></div><button id="resetWhere" class="text-button" type="button">重置今日</button></div>
        <div id="whereSummary" class="where-summary"></div>
        <div id="whereGroups" class="where-groups"></div>
      </section>

      <section id="batchView" class="view hidden">
        <div class="section-heading"><div><p class="eyebrow">临时点名组</p><h2>要交代的人</h2></div><button id="clearBatch" class="text-button danger" type="button">清空</button></div>
        <textarea id="batchNote" rows="3" placeholder="备注要交代的事情"></textarea>
        <div id="pickedList" class="picked-list"></div>
        <div class="batch-actions"><button id="copyBatch" class="primary-button" type="button">复制名单与备注</button></div>
      </section>
    </div>
  </main>

  <dialog id="dataDialog" class="data-dialog">
    <form method="dialog">
      <div class="dialog-head"><h2>数据管理</h2><button value="cancel" aria-label="关闭">×</button></div>
      <p id="dataStatus"></p>
      <section class="data-block"><h3>学生头像总库</h3><p>包含全班姓名、拼音和照片。可整包导入、备份或换机。</p><div class="data-actions"><label class="secondary-button file-button">导入总库<input id="studentFile" type="file" accept=".js,text/javascript,application/javascript"></label><button id="exportStudents" class="secondary-button" type="button">导出总库</button></div></section>
      <section class="data-block"><h3>每周值日 JS</h3><p id="dutyDataStatus">尚未导入</p><div class="data-actions"><label class="secondary-button file-button">替换值日<input id="dutyFile" type="file" accept=".js,text/javascript,application/javascript"></label><button id="exportDuty" class="secondary-button" type="button">导出当前</button></div></section>
      <section class="data-block"><h3>宿舍成员 JS</h3><p id="dormDataStatus">尚未导入</p><div class="data-actions"><label class="secondary-button file-button">替换宿舍<input id="dormFile" type="file" accept=".js,text/javascript,application/javascript"></label><button id="exportDorm" class="secondary-button" type="button">导出当前</button></div></section>
      <button id="forgetData" class="text-button danger full" type="button">清除本机全部数据</button>
      <p class="fineprint">三个数据包彼此独立。替换值日或宿舍不会改动学生照片。</p>
    </form>
  </dialog>

  <dialog id="personDialog" class="person-dialog">
    <form method="dialog" class="person-viewer">
      <div id="personHero" class="person-hero">
        <img id="personPhoto" alt="">
        <button class="viewer-close" value="cancel" aria-label="关闭">×</button>
        <button id="personPrev" class="viewer-nav viewer-prev" type="button" aria-label="上一个学生">‹</button>
        <button id="personNext" class="viewer-nav viewer-next" type="button" aria-label="下一个学生">›</button>
        <div class="viewer-copy">
          <p id="personPinyin"></p>
          <h2 id="personName">学生</h2>
          <p id="personDorm"></p>
        </div>
      </div>
      <div class="viewer-actions">
        <button id="personPick" class="viewer-action" type="button">加入点人</button>
        <button id="togglePersonEditor" class="viewer-action primary" type="button">去向 / 请假</button>
      </div>
      <section id="personEditor" class="person-editor hidden" aria-label="编辑学生状态">
        <div class="editor-head"><h3>更新状态</h3><button id="closePersonEditor" type="button" aria-label="收起编辑面板">×</button></div>
        <label class="field-label">今日去向<select id="personStatus"></select></label>
        <label id="leaveUntilWrap" class="field-label hidden">请假至<input id="leaveUntil" type="date"></label>
        <label class="field-label">备注<input id="personNote" type="text" placeholder="可不填"></label>
        <label class="secondary-button file-button full-button">拍照或更换头像<input id="personPhotoFile" type="file" accept="image/*" capture="environment"></label>
        <button id="savePerson" class="primary-button full-button" type="button">保存</button>
      </section>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=20260915-4" defer></script>
</body>
</html>
